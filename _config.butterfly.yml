# Butterfly 主题配置（覆盖 themes/butterfly/_config.yml 中的同名项）
# 文档：https://butterfly.js.org/

# ---------- 导航 ----------
nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

social:
  fab fa-github: https://github.com/qiangstart || Github || '#8b5cf6'
  fas fa-envelope: mailto:Qiang@dr.com || Email || '#4a7dbe'
  fas fa-rss: /atom.xml || RSS || '#f26522'

# ---------- 图片 ----------
favicon: /img/avatar.svg

avatar:
  img: /img/avatar.svg
  effect: false

index_img: /img/banner.svg
default_top_img: /img/banner.svg
archive_img: /img/banner.svg
tag_img: /img/banner.svg
category_img: /img/banner.svg

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/cover-1.svg
    - /img/cover-2.svg
    - /img/cover-3.svg
    - /img/cover-4.svg

# 首页顶部大图占满全屏
index_top_img_height: 100vh

# 打字机副标题
subtitle:
  enable: true
  effect: true
  typed_option:
    loop: true
    backSpeed: 40
    typeSpeed: 120
  sub:
    - 记录代码、阅读与生活的点滴
    - 写下来的东西，才真正属于你
    - Stay hungry, stay foolish.

# 首页文章卡片：封面左右交替
index_layout: 3
index_post_content:
  method: 2
  length: 150

# ---------- 文章 ----------
code_blocks:
  theme: pale night
  macStyle: true
  height_limit: 400
  copy: true
  language: true
  shrink: false

toc:
  post: true
  number: false
  scroll_percent: true

post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 4

post_pagination: 2

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ---------- 侧边栏 ----------
aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 热爱技术与写作的开发者
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/qiangstart
  card_announcement:
    enable: true
    content: 欢迎来到 Qiang 的博客！这里分享编程心得、读书笔记和日常随想 ✨
  card_recent_post:
    enable: true
    limit: 5
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 10/31/2026 00:00:00

footer:
  owner:
    enable: true
    since: 2026
  custom_text: 用心记录每一天

# ---------- 功能 ----------
darkmode:
  enable: true
  button: true
  autoChangeMode: 1   # 跟随系统

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1

readmode: true
rightside_scroll_percent: true

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

lightbox: medium_zoom

pjax:
  enable: true

snackbar:
  enable: true
  position: bottom-left

lazyload:
  enable: true
  field: site

instantpage: true

# ---------- 美化 ----------
beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#F47466'

enter_transitions: true
rounded_corners_ui: true
text_align_justify: false

preloader:
  enable: true
  source: 1

# 点击爱心特效
click_heart:
  enable: true
  mobile: false

# 自定义样式
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
